# T12: test + benchmark + site data (GitHub REST API history) + GitHub Pages deploy.
# Uses only the built-in GITHUB_TOKEN; no other secrets.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {} # least privilege: each job declares only what it needs

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      actions: read # REST API: workflow runs + bench-summary artifacts
    steps:
      # All actions below run on Node.js 24 (runs.using: node24); Node 20 actions are deprecated.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # benchmark.js reads HEAD and diffs the generator lock commit

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Secret scan (tracked files, including this workflow)
        run: |
          # Prefixes are split with '' so this file never matches its own patterns;
          # -l prints file names only, never the matching line (public log).
          P='gh''p_[A-Za-z0-9]{20,}|github''_pat_[A-Za-z0-9_]{20,}|s''k-[A-Za-z0-9_-]{20,}|AK''IA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIV''ATE KEY'
          if git grep -lIE "$P" -- .; then
            echo "::error::possible secret in the tracked file(s) listed above"
            exit 1
          fi
          echo "secret scan: clean"

      - name: Benchmark (tuning 101-110, held-out 1-10)
        run: node harness/benchmark.js --out-dir "$RUNNER_TEMP/bench"

      - name: Assemble site (static pages first, fresh data written after)
        run: |
          mkdir -p _site
          if [ -d site ]; then cp -R site/. _site/; else echo "site/ not present on this commit; publishing data only"; fi
          rm -rf _site/data
          touch _site/.nojekyll

      - name: Build site data (REST API history)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node harness/reports/build-site-data.js --bench "$RUNNER_TEMP/bench/latest.json" --out _site/data
          find _site -maxdepth 2 -type f | sort

      - uses: actions/upload-artifact@v6 # v5 still defaulted to Node 20
        with:
          name: bench-summary
          path: _site/data/bench-summary.json
          retention-days: 90

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true # v4+ drops dotfiles by default; keep _site/.nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
